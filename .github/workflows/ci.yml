name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality-gate:
    name: Rust quality gate (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_service

      - name: rustfmt
        working-directory: rust_service
        run: cargo fmt -- --check

      - name: clippy
        working-directory: rust_service
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: rust_service
        run: cargo test --all-targets

  windows-tests:
    name: Windows Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 官方 action 生态里没有稳定的 protoc 安装 action，直接取官方发布包，
      # 版本与本地约定保持一致（v27.3）。
      - name: Install protoc
        shell: pwsh
        run: |
          $version = "27.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dir = Join-Path $env:RUNNER_TEMP "protoc"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          (Join-Path $dir "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $dir "bin\protoc.exe") --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_service

      - name: test
        working-directory: rust_service
        run: cargo test --all-targets

  # Bridge DLL 需要 vcpkg 提供的 protobuf C++ 运行时，CI 成本高，
  # 构建与冒烟测试按 README 在本机 Windows x64 验证。