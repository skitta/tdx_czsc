name: Release

# 发布 Windows x86_64 产物：
#   - push tag v*（如 v0.9.0）→ 构建 + 打包 + 创建 GitHub Release
#   - 手动触发（workflow_dispatch）→ 只构建 + 上传 artifact，不创建 Release
#
# 产物内容（通达信 T0002/dlls/ 直接可用）：
#   tdx_czsc_service.exe / tdx_czsc_bridge.dll + protobuf C++ 运行时 DLL
#   + 两个 ini.example 配置文件 + README.md
#
# 注：DLL 冒烟测试（ipc/deploy smoke）仍需本机真实通达信环境，不在此工作流内。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 需要

env:
  CARGO_TERM_COLOR: always
  # Rust build.rs 使用的 protoc（官方发布包，自包含）；C++ 侧用 vcpkg 自带 protoc。
  PROTOC_VERSION: "27.3"
  # vcpkg 二进制缓存目录，配合 actions/cache 避免每次重编译 protobuf C++ 运行时。
  VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

jobs:
  windows-x64:
    name: Build Windows x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # tag 与包版本不一致会产出误导性发版，提前失败。
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $content = Get-Content rust_service/Cargo.toml -Raw
          $version = [regex]::Match($content, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME 与 rust_service/Cargo.toml 版本 v$version 不一致"
          }

      - name: Install protoc (Rust build script)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dir = Join-Path $env:RUNNER_TEMP "protoc"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          (Join-Path $dir "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $dir "bin\protoc.exe") --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_service

      - name: Build rust service (release)
        working-directory: rust_service
        run: cargo build --release

      - uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-protobuf-${{ runner.os }}
          restore-keys: vcpkg-protobuf-

      - name: Ensure vcpkg available
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT -or -not (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败" }
            # 同一步内后续命令也要能看到该变量（GITHUB_ENV 仅影响后续步骤）
            $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg"
            "VCPKG_INSTALLATION_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      - name: Install protobuf (vcpkg, x64-windows)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install protobuf:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install protobuf:x64-windows 失败" }

      - name: Configure bridge DLL
        shell: pwsh
        run: |
          cmake -S bridge_dll -B bridge_dll/build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw "cmake configure 失败" }

      - name: Build bridge DLL (Release)
        run: cmake --build bridge_dll/build --config Release

      # 临时诊断：定位 protobuf 库与生成代码版本/导出不一致导致的 LNK2019
      - name: Diagnose protobuf linkage
        if: always()
        shell: pwsh
        run: |
          $cache = "bridge_dll/build/CMakeCache.txt"
          if (Test-Path $cache) {
            "=== CMakeCache Protobuf 项 ==="
            Select-String -Path $cache -Pattern "Protobuf" | ForEach-Object { $_.Line }
          }
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows"
          "=== vcpkg protobuf 文件 ==="
          Get-ChildItem "$installed/lib/libprotobuf.*", "$installed/bin/libprotobuf.dll" -ErrorAction SilentlyContinue |
            Format-Table Name, Length, LastWriteTime
          "=== 运行时版本头 ==="
          Select-String -Path "$installed/include/google/protobuf/runtime_version.h" -Pattern "VERSION" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Line }
          foreach ($f in @("$installed/lib/libprotobuf.lib", "$installed/bin/libprotobuf.dll")) {
            if (Test-Path $f) {
              $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($f))
              "$([System.IO.Path]::GetFileName($f)): fixed_address_empty_string=$($ascii.Contains('fixed_address_empty_string')) GlobalEmptyStringConstexpr=$($ascii.Contains('GlobalEmptyStringConstexpr'))"
            }
          }
          "=== 实际编译命令行片段 ==="
          & cmake --build bridge_dll/build --config Release --verbose 2>&1 |
            Select-String -Pattern "analysis.pb|PROTOBUF_USE_DLLS|libprotobuf.lib" |
            Select-Object -First 12 |
            ForEach-Object { $_.Line.Substring(0, [Math]::Min(500, $_.Line.Length)) }

      - name: Assemble package directory
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "rust_service/target/release/tdx_czsc_service.exe" $dist
          Copy-Item "bridge_dll/build/Release/tdx_czsc_bridge.dll" $dist
          # protobuf C++ 运行时：DLL 侧动态依赖，必须与 tdx_czsc_bridge.dll 同目录
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin"
          foreach ($pattern in @("libprotobuf.dll", "abseil_dll.dll", "utf8*.dll")) {
            Get-ChildItem -Path $vcpkgBin -Filter $pattern -ErrorAction SilentlyContinue |
              Copy-Item -Destination $dist
          }
          Copy-Item "bridge_dll/tdx_czsc_bridge.ini.example" $dist
          Copy-Item "rust_service/tdx_czsc_service.ini.example" $dist
          Copy-Item "README.md" $dist

          foreach ($required in @("tdx_czsc_service.exe", "tdx_czsc_bridge.dll", "libprotobuf.dll")) {
            if (-not (Test-Path (Join-Path $dist $required))) { throw "打包缺少必需文件: $required" }
          }
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Create zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") {
            "tdx_czsc-$env:GITHUB_REF_NAME-windows-x64"
          } else {
            "tdx_czsc-$($env:GITHUB_SHA.Substring(0, 7))-windows-x64"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tdx_czsc-windows-x64
          path: |
            dist
            *.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = (Get-ChildItem *.zip | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $zip `
            --title "tdx_czsc $env:GITHUB_REF_NAME" `
            --generate-notes
