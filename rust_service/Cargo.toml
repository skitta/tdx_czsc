[package]
name = "tdx_czsc_service"
version = "0.1.0"
edition = "2024"
description = "Local Rust analysis service for TDX CZSC bridge (缠论自动标注)"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
czsc-core = "1"
czsc-signals = "1.0.1"
prost = "0.13"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.13"

# 发布构建（P2 实测决策）：thin LTO + codegen-units=1 仅带来 ~5% 性能
# 增益但 release 构建时间约 10 倍（6m49s vs ~40s），负收益弃用；
# strip=debuginfo 零编译代价，减小部署体积（保留）。
[profile.release]
strip = "debuginfo"
