[package]
name = "tdx_czsc_service"
version = "0.1.0"
edition = "2024"
description = "Local Rust analysis service for TDX CZSC bridge (缠论自动标注)"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
czsc-core = "1"
czsc-signals = "1.0.1"
prost = "0.13"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.13"
